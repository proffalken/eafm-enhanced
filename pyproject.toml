[project]
name = "eafm-enhanced"
version = "2.2.0"
description = "Home Assistant custom integration for Environment Agency flood monitoring"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component>=0.13.373",
    "pytest-cov>=6.0",
    "ruff>=0.14",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 88
# Only the flood warning code and tests are checked; the original gauge code
# keeps its upstream style so the fork stays easy to compare.
include = [
    "custom_components/eafm_enhanced/floods.py",
    "custom_components/eafm_enhanced/flood_entities.py",
    "custom_components/eafm_enhanced/binary_sensor.py",
    "tests/**/*.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
